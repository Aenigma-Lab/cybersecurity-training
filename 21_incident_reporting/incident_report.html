<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incident Reporting</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding-top: 30px;
            padding-bottom: 30px;
        }
        

        
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.15);
            max-width: 900px;
            width: 100%;
        }
        
        h1 {
            text-align: center;
            color: #333;
            font-size: 32px;
            margin-bottom: 30px;
        }
        
        h2 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 15px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        
        h3 {
            color: #d9534f;
            font-size: 20px;
            margin-bottom: 20px;
        }
        
        .contact-section {
            margin-bottom: 40px;
            text-align: center;
            padding: 20px;
        }
        
        .contact-section h2 {
            text-align: center;
        }
        
        .contact-section p {
            font-size: 18px;
            color: #555;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .contact-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        .contact-card {
            background-color: white;
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
            min-width: 200px;
            max-width: 220px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .contact-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }
        
        .contact-card .icon {
            font-size: 36px;
            margin-bottom: 15px;
        }
        
        .contact-card .team-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }
        
        .contact-card.it { border-top: 4px solid #5cb85c; }
        .contact-card.it .team-name { color: #5cb85c; }
        
        .contact-card.software { border-top: 4px solid #f0ad4e; }
        .contact-card.software .team-name { color: #f0ad4e; }
        
        .contact-card.hr { border-top: 4px solid #d9534f; }
        .contact-card.hr .team-name { color: #d9534f; }
        
        .contact-card a {
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .contact-card a:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        
        .contact-card.it a { background-color: #5cb85c; }
        .contact-card.it a:hover { background-color: #4cae4c; }
        
        .contact-card.software a { background-color: #f0ad4e; }
        .contact-card.software a:hover { background-color: #ec971f; }
        
        .contact-card.hr a { background-color: #d9534f; }
        .contact-card.hr a:hover { background-color: #c9302c; }
        
        .form-section {
            margin-top: 40px;
        }
        
        form {
            margin-top: 20px;
        }
        
        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            align-items: flex-start;
        }
        
        .form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 16px;
            color: #333;
            text-align: left;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #3498db;
        }
        
        textarea {
            min-height: 150px;
            resize: vertical;
        }
        
        button[type="submit"] {
            background-color: #337ab7;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: auto;
            min-width: 250px;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            display: block;
            margin: 30px auto 0 auto;
        }
        
        button[type="submit"]:hover {
            background-color: #286090;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
        }
        
        .alert {
            display: none;
            padding: 15px 20px;
            margin-top: 20px;
            border-radius: 6px;
            font-size: 16px;
        }
        
        .alert.success {
            background-color: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }
        
        .alert.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }
        
        .warning-banner {
            background-color: #d9534f;
            color: white;
            padding: 15px 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-size: 18px;
            text-align: center;
            border: 3px solid #c9302c;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(217, 83, 79, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(217, 83, 79, 0); }
            100% { box-shadow: 0 0 0 0 rgba(217, 83, 79, 0); }
        }
        
        .info-text {
            font-size: 14px;
            color: #777;
            font-style: italic;
            margin-top: -10px;
            margin-bottom: 15px;
        }
        
        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }
            
            .contact-buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .contact-card {
                width: 100%;
                max-width: 300px;
                margin-bottom: 20px;
            }
            
            .contact-buttons {
                gap: 15px;
            }
            
            .warning-banner {
                margin: 0 15px 20px 15px;
                padding: 15px 20px;
            }
            
            .container {
                padding: 25px 20px;
                margin: 0 15px;
            }
            
            button[type="submit"] {
                width: 100%;
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="warning-banner">
            ⚠️ <strong>REPORT ALL INCIDENTS - HIDING INCIDENTS IS A CRIME</strong> ⚠️
        </div>
        <h1>Who to Contact for Incidents</h1>
        
        <div class="contact-section">
            <h2>Immediate Contact Options</h2>
            <p>If you notice any incident or suspicious activity, contact the relevant team immediately:</p>
            <div class="contact-buttons">
                <div class="contact-card it">
                    <div class="icon">🖥️</div>
                    <div class="team-name">IT Team</div>
                    <a href="mailto:it@company.com?subject=Urgent%20Incident%20Report">📧 Contact</a>
                </div>
                <div class="contact-card software">
                    <div class="icon">💻</div>
                    <div class="team-name">Software Team</div>
                    <a href="mailto:software@company.com?subject=Urgent%20Incident%20Report">📧 Contact</a>
                </div>
                <div class="contact-card hr">
                    <div class="icon">👥</div>
                    <div class="team-name">HR Team</div>
                    <a href="mailto:hr@company.com?subject=Urgent%20Incident%20Report">📧 Contact</a>
                </div>
            </div>
        </div>
